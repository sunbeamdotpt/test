[package]
name = "sunbeam-test"
version = "2026.7.2"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/sunbeam-pt/sunbeam-test"
description = "Custom testcontainers-rs builders for Sunbeam services"

[dependencies]
testcontainers = { version = "0.27.3", features = ["blocking"] }
bollard = "0.20"
tar = "0.4"
futures-util = "0.3"
bytes = "1"
serde_json = "1"
flate2 = "1"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
